[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 30

# Warm light palette. Pinned to base="light" on purpose: the app paints a light
# amber gradient background, so a viewer's dark-mode preference would otherwise
# leave light-on-light text.
[theme]
base = "light"
primaryColor = "#F2683C"
backgroundColor = "#FFFDF9"
secondaryBackgroundColor = "#FFF4E4"
textColor = "#1F2328"
