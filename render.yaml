services:
  - type: web
    name: legal-doc-compare
    runtime: python
    plan: starter  # free tier's 512MB RAM is not enough once OCR models load
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Set these in the Render dashboard — never commit real values.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
